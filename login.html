<!-- login form -->
    
<div class="container my-5">
  <h1>Get in touch</h1>
  <p>We'd love to hear from you</p>

  <form>
    <div class="row justify-content-center">
      <div class="col-md-5 col-12">
        <input type="text" class="form-control mb-3" placeholder="Full name" aria-label="Full name" required>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-5 col-12">
        <input type="email" class="form-control mb-3" placeholder="Email address" aria-label="Email address" required>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-5 col-12">
        <input type="tel" class="form-control mb-3" placeholder="Phone number" aria-label="Phone number">
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-5 col-12">
        <textarea class="form-control mb-3" placeholder="Message" aria-label="Message" rows="4" required></textarea>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-5 col-12">
        <button class="btn btn-primary w-100" type="submit">Submit form</button>
      </div>
    </div>
  </form>
</div>
